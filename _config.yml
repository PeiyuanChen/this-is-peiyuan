title: "Peiyuan"
locale: "zh-CN"
url: "https://peiyuan.me"

image_cdn: ""

theme: minimal-mistakes-jekyll

date_format: "%Y年%-m月%-d日"

collections:
  essays:
    output: true
    permalink: /essays/:year/:slug/

# 随感 RSS 由根目录物理 feed.xml 模板自渲染（jekyll-feed 检测到同名物理文件会跳过生成）

exclude:
  - temp

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
